<div class="main-container">
  <header>
    <h1>{{ title }}</h1>
    <p>Select your seats for an unforgettable experience.</p>
  </header>

  <main>
    <section class="booking-area">
      <app-seat-layout 
        [config]="config" 
        (selectionChanged)="onSelectionChanged($event)"
      ></app-seat-layout>
      
      <app-booking-summary 
        [selectedSeats]="selectedSeats"
      ></app-booking-summary>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Premium Seats. All rights reserved.</p>
  </footer>
</div>

<router-outlet></router-outlet>
